<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>스마트 칭찬 노트 - 학생</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body class="student-app">
    <main class="app-shell app-shell-mobile">

      <p id="student-status" class="status app-status"></p>

      <section class="tab-panel active" data-tab-panel="home">
        <section class="avatar-hero surface-card">
          <div class="avatar-stage" style="position: relative; width: 100%; height: 230px; overflow: visible; display: block; border-radius: 0; background: none; box-shadow: none;">
            <!-- 아바타 이미지 (JS에서 getAvatarPetLayout 수치 반영됨) -->
            <img id="current-avatar" alt="현재 아바타" style="image-rendering: pixelated;">
            <!-- 마이펫 이미지 (JS에서 getAvatarPetLayout 수치 반영됨) -->
            <img id="current-pet" alt="현재 마이펫" style="image-rendering: pixelated;">
          </div>
          <div class="level-pill">Lv. <span id="level-value">1</span></div>
          <h2 id="home-title" class="screen-title">나의 성장</h2>
          <p class="screen-copy">칭찬을 모아 아바타와 마이펫을 성장시켜요.</p>
        </section>

        <section class="xp-card surface-card card-3d">
          <div class="section-row">
            <span class="eyebrow">XP</span>
            <strong><span id="xp-value">0</span> XP</strong>
          </div>
          <div class="progress">
            <div id="level-progress" class="progress-fill"></div>
          </div>
          <p id="next-level-value" class="status"></p>
        </section>

        <section class="summary-grid">
          <article class="summary-card card-3d">
            <span class="material-symbols-outlined">backpack</span>
            <div>
              <p>보유 보상</p>
              <strong id="reward-count">0</strong>
            </div>
          </article>
          <article class="summary-card card-3d">
            <span class="material-symbols-outlined">workspace_premium</span>
            <div>
              <p>최근 칭찬</p>
              <strong id="recent-praise-count">0</strong>
            </div>
          </article>
        </section>


      </section>

      <section class="tab-panel" data-tab-panel="collection">
        <div class="section-heading">
          <h2>보관함</h2>
          <p>칭찬을 받을 때마다 새 보상이 열립니다.</p>
        </div>
        <div class="segmented-control theme-black collection-tabs" role="tablist" aria-label="보관함 종류">
          <button class="segment active" type="button" data-collection-target="avatar">아바타</button>
          <button class="segment" type="button" data-collection-target="pet">마이펫</button>
        </div>
        <div id="avatar-gender-toggle-container" class="segmented-control theme-black" style="display: flex; gap: 0; margin-bottom: 12px; justify-content: flex-end; width: 90px; margin-left: auto; padding: 3px;">
          <button class="segment active" type="button" data-gender-target="1" style="font-size: 13px; font-weight: 700; flex: 1; text-align: center; padding: 4px 0;">남</button>
          <button class="segment" type="button" data-gender-target="2" style="font-size: 13px; font-weight: 700; flex: 1; text-align: center; padding: 4px 0;">여</button>
        </div>
        <div id="avatar-grid" class="collection-grid active" data-collection-panel="avatar"></div>
        <div id="pet-grid" class="collection-grid" data-collection-panel="pet"></div>
      </section>

      <section class="tab-panel" data-tab-panel="history">
        <div class="section-heading">
          <h2>칭찬 기록</h2>
          <p>받은 칭찬과 열린 보상을 시간순으로 확인합니다.</p>
        </div>
        <div id="log-list" class="timeline-list"></div>
      </section>

      <section class="tab-panel" data-tab-panel="settings">
        <div class="section-heading">
          <h2>설정</h2>
          <p>학생 정보와 앱 상태를 확인합니다.</p>
        </div>
        <section class="surface-card settings-list">
          <div class="metric-row">
            <span class="metric-label">학번</span>
            <strong id="settings-student-id">-</strong>
          </div>
          <div class="metric-row">
            <span class="metric-label">현재 점수</span>
            <strong id="settings-student-xp">-</strong>
          </div>
          <div class="metric-row">
            <span class="metric-label">보유 아바타</span>
            <strong id="settings-student-avatar-count">-</strong>
          </div>
          <div class="metric-row">
            <span class="metric-label">보유 마이펫</span>
            <strong id="settings-student-pet-count">-</strong>
          </div>
        </section>
        <button id="reset-data-button" class="button full-width" type="button" style="background: #000000; color: #ffffff; border: 1px solid #000000; margin-bottom: 12px; font-weight: 700;">데이터 초기화</button>
        <button id="logout-button" class="button danger full-width" type="button">로그아웃</button>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="학생 화면">
      <button class="bottom-nav-item active" type="button" data-tab-target="home">
        <span class="material-symbols-outlined">home</span>
        <span>홈</span>
      </button>
      <button class="bottom-nav-item" type="button" data-tab-target="collection">
        <span class="material-symbols-outlined">backpack</span>
        <span>보관함</span>
      </button>
      <button class="bottom-nav-item" type="button" data-tab-target="history">
        <span class="material-symbols-outlined">history</span>
        <span>기록</span>
      </button>
      <button class="bottom-nav-item" type="button" data-tab-target="settings">
        <span class="material-symbols-outlined">settings</span>
        <span>설정</span>
      </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/rules.js"></script>
    <script src="assets/js/student.js"></script>
  </body>
</html>
