<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>성장 노트 - 포털</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="panel login-panel">
        <div class="brand">
          <h1 class="brand-title">성장 노트</h1>
          <p class="brand-subtitle">아바타 & 마이펫 성장 시스템</p>
        </div>

        <div class="system-intro" style="margin-top: 24px; font-size: 15px; line-height: 1.6; color: var(--muted);">
          <p>
            성장 노트에 오신 것을 환영합니다! 칭찬을 통해 획득한 경험치(XP)로 아바타와 마이펫을 성장시킬 수 있습니다.
          </p>
          <p style="margin-top: 8px;">
            역할에 맞는 로그인 페이지를 선택해 주세요.
          </p>
        </div>

        <div class="form-stack" style="margin-top: 32px; gap: 16px;">
          <a class="button full-width" href="student-login.html" style="justify-content: flex-start; padding: 16px 20px; min-height: 64px;">
            <span class="material-symbols-outlined" style="font-size: 28px;">person</span>
            <div style="text-align: left; margin-left: 8px;">
              <div style="font-weight: 800; font-size: 16px;">학생 로그인</div>
              <div style="font-weight: 500; font-size: 12px; opacity: 0.85; margin-top: 2px;">아바타 및 마이펫 확인하기</div>
            </div>
          </a>

          <a class="button secondary full-width" href="teacher.html" style="justify-content: flex-start; padding: 16px 20px; min-height: 64px; border: 1px solid var(--line);">
            <span class="material-symbols-outlined" style="font-size: 28px;">school</span>
            <div style="text-align: left; margin-left: 8px;">
              <div style="font-weight: 800; font-size: 16px;">교사용 칭찬 부여</div>
              <div style="font-weight: 500; font-size: 12px; opacity: 0.85; margin-top: 2px;">학생 칭찬 기록 및 보상 지급</div>
            </div>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
