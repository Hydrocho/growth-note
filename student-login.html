<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>성장 노트 - 학생 로그인</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="panel login-panel">
        <div class="brand">
          <h1 class="brand-title">성장 노트</h1>
          <p class="brand-subtitle">학번 아이디와 PIN으로 내 아바타와 마이펫을 확인합니다.</p>
        </div>

        <form id="student-login-form" class="form-stack" style="margin-top: 24px;">
          <div class="field">
            <label for="student-id">학번 아이디</label>
            <input id="student-id" class="input" type="text" inputmode="numeric" autocomplete="username" placeholder="예: 30110" required>
            <p class="status">3학년 1반 10번은 30110으로 입력합니다.</p>
          </div>

          <div class="field">
            <label for="student-pin">PIN</label>
            <input id="student-pin" class="input" type="password" inputmode="numeric" autocomplete="off" required>
          </div>

          <button id="login-button" class="button" type="submit">
            <span class="material-symbols-outlined">login</span>
            입장
          </button>
          <p id="login-status" class="status"></p>
        </form>

        <div class="nav-actions" style="margin-top: 18px;">
          <a class="button secondary card-3d" href="index.html">
            <span class="material-symbols-outlined">home</span>
            메인 페이지로
          </a>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/rules.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
