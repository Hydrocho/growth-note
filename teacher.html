<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>성장 노트 - 칭찬 부여</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1 class="brand-title">칭찬 부여</h1>
          <p class="brand-subtitle">학생을 선택하고 정해진 칭찬을 지급합니다.</p>
        </div>
        <div class="nav-actions">
          <a class="button secondary" href="index.html">
            <span class="material-symbols-outlined">home</span>
            포털 메인
          </a>
          <a class="button secondary" href="student-login.html">
            <span class="material-symbols-outlined">person</span>
            학생 로그인
          </a>
        </div>
      </header>

      <section id="admin-gate" class="panel login-panel">
        <form id="admin-form" class="form-stack">
          <div class="field">
            <label for="admin-pin">관리자 PIN</label>
            <input id="admin-pin" class="input" type="password" inputmode="numeric" autocomplete="off" required>
          </div>
          <button class="button" type="submit">
            <span class="material-symbols-outlined">lock_open</span>
            교사용 화면 열기
          </button>
          <p class="status">초기 PIN은 teacher.js에서 바꿀 수 있습니다. 운영 보안은 Supabase RPC로 강화해야 합니다.</p>
          <p id="admin-status" class="status"></p>
        </form>
      </section>

      <section id="teacher-app" class="teacher-layout hidden">
        <aside class="card">
          <div class="field">
            <label for="student-search">학생 검색</label>
            <input id="student-search" class="input" type="search" placeholder="학번, 이름, 별명">
          </div>
          <div id="student-list" class="student-list" style="margin-top: 12px;"></div>
        </aside>

        <section class="card">
          <h2 id="selected-student-title">학생을 선택하세요</h2>
          <div id="selected-student-meta" class="status"></div>
          <div id="praise-buttons" class="praise-buttons" style="margin-top: 16px;"></div>
          <div id="praise-result" class="result-box hidden" style="margin-top: 16px;"></div>
          <p id="teacher-status" class="status"></p>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/rules.js"></script>
    <script src="assets/js/rewards.js"></script>
    <script src="assets/js/teacher.js"></script>
  </body>
</html>
